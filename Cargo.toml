[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dnh33/orin"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
rayon = "1.12"
memchr = "2.8"
notify = "8.2"
interprocess = "2.4"
ignore = "0.4"
ratatui = "0.30"
crossterm = "0.29"
rmcp = "3.5"
bytemuck = { version = "1", features = ["derive"] }
crc32fast = "1"
unicode-normalization = "0.1"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
open = "5"
tempfile = "3"
globset = "0.4"
ctrlc = "3"
sysinfo = { version = "0.31", default-features = false, features = ["system"] }
regex = "1"
whoami = "1.4"

[profile.release]
lto = "thin"
strip = true
