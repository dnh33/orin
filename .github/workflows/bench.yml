name: bench

on:
  workflow_dispatch:
    inputs:
      corpus:
        type: choice
        options: [tiny, medium, large]
        default: tiny
      tool:
        type: choice
        options: [orin, fd, find, rg]
        default: orin

defaults:
  run:
    shell: bash

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate corpus
        run: |
          mkdir -p "$RUNNER_TEMP/orin-bench/corpus"
          cargo run --release -p orin-bench gen \
            --corpus ${{ inputs.corpus }} \
            --out "$RUNNER_TEMP/orin-bench/corpus" \
            --seed 0xC0FFEE
      - name: Upload corpus
        uses: actions/upload-artifact@v4
        with:
          name: bench-corpus
          path: ${{ runner.temp }}/orin-bench/corpus
          retention-days: 1

  bench:
    needs: gen
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows-first: ubuntu/macos PARKED (2026-10-10 owner decision) —
        # re-enable by uncommenting the os entries when Windows is solid.
        os: [windows-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
        tool: [orin, fd, find, rg]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fd/rg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fd-find ripgrep
      - name: Install fd/rg (macos)
        if: runner.os == 'macOS'
        run: brew install fd ripgrep
      - name: Install fd/rg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install fd ripgrep -y
          refreshenv
      - name: Download corpus
        uses: actions/download-artifact@v4
        with:
          name: bench-corpus
          path: ${{ runner.temp }}/orin-bench/corpus
      - name: Build bench + orin binaries
        run: cargo build --release -p orin-bench -p orin-cli -p orin-daemon
      - name: Run benchmark
        run: |
          cargo run --release -p orin-bench run \
            --tool ${{ matrix.tool }} \
            --corpus "$RUNNER_TEMP/orin-bench/corpus" \
            --queries crates/orin-bench/queries.json \
            --iterations 1000 \
            --out "$RUNNER_TEMP/orin-bench/results_${{ matrix.tool }}_${{ matrix.os }}.json"
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.os }}-${{ matrix.tool }}
          path: ${{ runner.temp }}/orin-bench/results_*.json
