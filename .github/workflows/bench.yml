name: bench

on:
  workflow_dispatch:
    inputs:
      corpus:
        type: choice
        options: [tiny, medium, large]
        default: tiny
      tool:
        type: choice
        options: [all, orin, fd, find, rg]
        default: all
      iterations:
        description: Iterations per query (100-200 = fast perf-fix loop, 1000 = full run)
        type: string
        default: "1000"

defaults:
  run:
    shell: bash

jobs:
  bench:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows-first: ubuntu/macos PARKED (2026-10-10 owner decision) —
        # re-enable by uncommenting the os entries when Windows is solid.
        os: [windows-latest]
        # os: [ubuntu-latest, macos-latest, windows-latest]
        # tool filter via inputs (matrix is NOT available in job-level `if`):
        tool: ${{ fromJSON(inputs.tool == 'all' && '["orin","fd","find","rg"]' || format('["{0}"]', inputs.tool)) }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install fd/rg (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Official install methods:
          #   sharkdp/fd README     -> choco install fd       | winget install sharkdp.fd
          #   BurntSushi/ripgrep README -> choco install ripgrep | winget install BurntSushi.ripgrep.MSVC
          # choco community feed 504s occasionally (seen 2026-10-10), so per-tool fallback to
          # winget, then HARD verification - fail here loudly, never mid-benchmark.
          foreach ($tool in @(
            @{ name = 'fd'; choco = 'fd';      winget = 'sharkdp.fd' },
            @{ name = 'rg'; choco = 'ripgrep'; winget = 'BurntSushi.ripgrep.MSVC' }
          )) {
            if (-not (Get-Command $tool.name -ErrorAction SilentlyContinue)) {
              choco install $tool.choco -y
            }
            if (-not (Get-Command $tool.name -ErrorAction SilentlyContinue)) {
              Write-Host "choco did not provide $($tool.name) - falling back to winget (official)"
              winget install --id $tool.winget -e --disable-interactivity `
                --accept-source-agreements --accept-package-agreements
            }
            if (-not (Get-Command $tool.name -ErrorAction SilentlyContinue)) {
              Write-Error "$($tool.name) not on PATH after choco + winget"; exit 1
            }
            & $tool.name --version
          }
      - name: Verify tool identities (bash PATH = the PATH the bench runs under)
        run: |
          # System32 find.exe (a string filter) must never answer `find` - it errors
          # instantly and the error exits get timed as if they were fast searches.
          # CreateProcess resolves names via the WINDOWS PATH order, which differs
          # from bash's - so export the verified binaries as Windows paths and make
          # the runner consume them (BENCH_TOOL_*), never a bare name.
          echo "find -> $(command -v find)"; find --version | head -1
          case "$(command -v find)" in
            /usr/bin/find|*/mingw*/find) echo "GNU find OK" ;;
            *) echo "find is NOT GNU findutils - refusing to bench"; exit 1 ;;
          esac
          echo "fd -> $(command -v fd)"; fd --version
          echo "rg -> $(command -v rg)"; rg --version
          {
            echo "BENCH_TOOL_FIND=$(cygpath -w "$(command -v find)")"
            echo "BENCH_TOOL_FD=$(cygpath -w "$(command -v fd)")"
            echo "BENCH_TOOL_RG=$(cygpath -w "$(command -v rg)")"
          } >> "$GITHUB_ENV"
      - name: Generate corpus (deterministic, same seed = identical tree)
        run: |
          cargo run --release -p orin-bench gen \
            --corpus ${{ inputs.corpus }} \
            --out "$RUNNER_TEMP/orin-bench/corpus" \
            --seed 0xC0FFEE
      - name: Build bench + orin binaries
        run: cargo build --release -p orin-bench -p orin-cli -p orin-daemon
      - name: Run benchmark
        run: |
          cargo run --release -p orin-bench run \
            --tool ${{ matrix.tool }} \
            --corpus "$RUNNER_TEMP/orin-bench/corpus" \
            --queries crates/orin-bench/queries.json \
            --iterations ${{ inputs.iterations }} \
            --out "$RUNNER_TEMP/orin-bench/results_${{ matrix.tool }}_${{ matrix.os }}.json"
      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.os }}-${{ matrix.tool }}
          path: ${{ runner.temp }}/orin-bench/results_*.json
