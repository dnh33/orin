# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
# Checked in CI by .github/workflows/security.yml

[advisories]
# Fail on yanked crate versions in the dependency graph.
yanked = "deny"
# Only fail on unmaintained advisories when a *direct* dependency is affected.
unmaintained = "workspace"
unsound = "workspace"
ignore = []

# Licenses not listed here are denied. For OR expressions, any listed option
# satisfies the expression.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "Unlicense",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
